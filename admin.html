<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCANGATE | Admin Moderation War Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cyber-glow-admin { box-shadow: 0 0 35px -5px rgba(220, 38, 38, 0.25); }
    </style>
</head>
<body class="bg-[#0A0A0A] text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between">

    <header class="border-b border-[#262626] bg-[#0A0A0A]/90 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 rounded-full bg-red-600 animate-ping"></div>
                <span class="text-xl font-black tracking-widest text-white">SCAN<span class="text-red-600">GATE</span></span>
                <span class="text-[10px] px-2.5 py-0.5 rounded-md bg-red-600/20 text-red-400 border border-red-500/30 font-mono">COMMANDER LEVEL</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="adminEmailDisplay" class="text-xs font-mono text-slate-400">Verifying session...</span>
                <a href="index.html" class="text-xs font-semibold bg-[#121212] hover:bg-[#1F1F1F] text-slate-300 border border-[#262626] px-3 py-1.5 rounded-lg">&larr; Exit War Room</a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10 flex-grow w-full space-y-8">
        <div class="bg-[#121212] border border-[#262626] rounded-2xl p-6 cyber-glow-admin flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <span class="text-xs font-mono text-red-500 uppercase tracking-widest">Global Moderation Panel</span>
                <h1 class="text-2xl font-black text-white mt-1">Incident & Dispute Review Queue</h1>
            </div>
            <button onclick="loadAdminData()" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 text-xs font-semibold px-4 py-2.5 rounded-xl">
                🔄 Refresh Queue Data
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-[#121212] border border-[#262626] rounded-2xl p-6 space-y-4">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300">Flagged Reports Queue</h2>
                <div id="reportsTableContainer" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                    <p class="text-xs text-slate-500 font-mono text-center py-8">Loading reports telemetry...</p>
                </div>
            </div>

            <div class="bg-[#121212] border border-[#262626] rounded-2xl p-6 space-y-4">
                <h2 class="text-sm font-bold uppercase tracking-wider text-slate-300">Counter-Claim Disputes</h2>
                <div id="disputesTableContainer" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                    <p class="text-xs text-slate-500 font-mono text-center py-8">Loading dispute queue...</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-6 border-t border-[#262626] bg-[#0A0A0A] text-center text-xs text-slate-600">
        SCANGATE Admin War Room &bull; Confidential Moderation Terminal
    </footer>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('adminEmailDisplay').innerText = `Active Commander: ${user.email}`;
                loadAdminData();
            } else {
                alert("Unauthorized access. Please login via auth portal first.");
                window.location.href = "auth.html";
            }
        });

        window.loadAdminData = async function() {
            const reportsContainer = document.getElementById('reportsTableContainer');
            const disputesContainer = document.getElementById('disputesTableContainer');
            try {
                const reportsSnap = await getDocs(collection(db, "reports"));
                reportsContainer.innerHTML = reportsSnap.empty ? `<p class="text-xs text-slate-500 text-center py-6">No reports found.</p>` : '';
                reportsSnap.forEach(d => {
                    const data = d.data();
                    reportsContainer.innerHTML += `<div class="p-4 rounded-xl bg-[#0A0A0A] border border-[#262626] space-y-2"><p class="text-xs text-white font-mono font-semibold">Target: ${data.targetValue}</p><p class="text-xs text-slate-300">${data.incidentDescription}</p><button onclick="deleteRecord('reports', '${d.id}')" class="text-red-400 text-[10px] underline">Purge Report</button></div>`;
                });

                const disputesSnap = await getDocs(collection(db, "disputes"));
                disputesContainer.innerHTML = disputesSnap.empty ? `<p class="text-xs text-slate-500 text-center py-6">No pending disputes.</p>` : '';
                disputesSnap.forEach(d => {
                    const data = d.data();
                    disputesContainer.innerHTML += `<div class="p-4 rounded-xl bg-[#0A0A0A] border border-[#262626] space-y-2"><p class="text-xs text-white font-mono font-semibold">Disputed Target: ${data.disputedTarget}</p><p class="text-xs text-slate-300">${data.defenseDetails}</p><button onclick="deleteRecord('disputes', '${d.id}')" class="text-blue-400 text-[10px] underline">Dismiss Dispute</button></div>`;
                });
            } catch (error) {
                console.error("Admin sync error:", error);
            }
        };

        window.deleteRecord = async function(col, id) {
            if (confirm("Permanently purge this record?")) {
                await deleteDoc(doc(db, col, id));
                loadAdminData();
            }
        }
    </script>
</body>
</html>
